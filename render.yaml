services:
  - type: web
    name: nexus-terminal-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXUS_API_ORIGIN
        fromService:
          name: nexus-terminal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MARKET_API_URL
        fromService:
          name: nexus-terminal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_FUTURES_DATA_MODE
        value: demo

  - type: web
    name: nexus-terminal-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://nexus-terminal-web.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: BINANCE_FUTURES_REST_URL
        value: https://demo-fapi.binance.com
      - key: BINANCE_FUTURES_WS_URL
        value: wss://stream.binancefuture.com/stream
      - key: BINANCE_FUTURES_DATA_MODE
        value: demo
