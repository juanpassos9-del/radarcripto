services:
  - type: web
    name: nexus-terminal-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXUS_API_ORIGIN
        fromService:
          name: nexus-terminal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MARKET_API_URL
        fromService:
          name: nexus-terminal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MARKET_MODE
        value: spot

  - type: web
    name: nexus-terminal-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://nexus-terminal-web.onrender.com
      - key: NEXUS_MARKET_MODE
        value: spot
      - key: BINANCE_SPOT_REST_URL
        value: https://data-api.binance.vision
      - key: BINANCE_SPOT_WS_URL
        value: wss://data-stream.binance.vision/stream
      - key: LOG_LEVEL
        value: INFO
