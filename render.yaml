envVarGroups:
  - name: nexus-market-auth
    envVars:
      - key: NEXUS_MARKET_TOKEN_SECRET
        generateValue: true

services:
  - type: web
    name: nexus-terminal-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - fromGroup: nexus-market-auth
      - key: NEXUS_API_ORIGIN
        fromService:
          name: nexus-terminal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MARKET_API_URL
        fromService:
          name: nexus-terminal-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MARKET_MODE
        value: spot
      - key: AUTH_SECRET
        generateValue: true
      - key: BETA_MAX_USERS
        value: "10"

  - type: web
    name: nexus-terminal-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: nexus-market-auth
      - key: CORS_ORIGINS
        value: https://nexus-terminal-web.onrender.com
      - key: NEXUS_MARKET_MODE
        value: spot
      - key: BETA_MAX_CONCURRENT_SESSIONS
        value: "10"
      - key: BETA_API_REQUESTS_PER_MINUTE
        value: "60"
      - key: FLOW_RETENTION_HOURS
        value: "1"
      - key: FLOW_AGG_RETENTION_DAYS
        value: "30"
      - key: FLOW_GAP_RECOVERY_MAX_TRADES
        value: "5000"
      - key: BINANCE_SPOT_REST_URL
        value: https://data-api.binance.vision
      - key: BINANCE_SPOT_WS_URL
        value: wss://data-stream.binance.vision/stream
      - key: LOG_LEVEL
        value: INFO
